name: release

# Tag-driven: `git tag v0.2.0 && git push --tags` publishes the wheel to PyPI and
# the wrapper to npm. Both must carry the same version — ci.yml enforces that.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
      # long-lived API token is stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Tag must match the packaged version
        run: |
          python - <<'PY'
          import os, re, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = re.search(r'^version = "(.+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          print("tag", tag, "| pyproject", ver)
          sys.exit(0 if tag == ver else f"tag {tag} != version {ver}")
          PY
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    needs: pypi
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish the wrapper
        # Runs only after PyPI succeeded: the wrapper resolves that exact version
        # at runtime, so publishing it first would ship a broken front door.
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
