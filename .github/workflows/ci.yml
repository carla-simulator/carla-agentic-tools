name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor (requires-python) and matches the CARLA cp310 wheel;
        # 3.12 catches anything that breaks on a modern interpreter.
        python: ["3.10", "3.12"]
        # The MCP SDK renamed its server class in 2.0, so both are exercised —
        # a published package is installed fresh and resolves the newest SDK.
        mcp: ["mcp>=1.2.0,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.mcp }}" pytest
          python -m pip install -e .
      - name: Structural + MCP tests
        run: python -m pytest -q tests/

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: The wheel must carry the skills
        # A wheel that installs cleanly but ships no SKILL.md is the exact
        # failure this project had before packaging was fixed, so assert on the
        # artifact rather than on the build exit code.
        run: |
          python - <<'PY'
          import glob, zipfile, collections, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          skills = [n for n in names if n.endswith("/SKILL.md")]
          scripts = [n for n in names if "/skills/" in n and "/scripts/" in n]
          groups = collections.Counter(n.split("/skills/")[1].split("/")[0] for n in skills)
          print(f"{whl}: {len(skills)} skills, {len(scripts)} scripts, groups={dict(groups)}")
          assert len(skills) >= 30, f"only {len(skills)} SKILL.md in the wheel"
          assert scripts, "no skill scripts in the wheel"
          assert not [n for n in names if "__pycache__" in n], "pycache leaked into the wheel"
          PY
      - name: Install the wheel and serve an MCP handshake
        # stdin must stay OPEN between frames: the stdio server shuts down on EOF,
        # and a single `printf a b c | server` pipe closes it fast enough that the
        # later requests are never answered (verified — looks like a broken tool
        # call, is actually a closed pipe). Hence the paced feeder.
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          (
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            sleep 2
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            sleep 1
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_skills","arguments":{}}}'
            sleep 5
          ) | timeout 90 /tmp/v/bin/carla-agentic-tools > /tmp/out.jsonl
          python - <<'PY'
          import json, pathlib, sys
          frames = [json.loads(l) for l in pathlib.Path("/tmp/out.jsonl").read_text().splitlines() if l.strip()]
          init = next(f for f in frames if f.get("id") == 1)
          print("serverInfo:", init["result"]["serverInfo"])
          call = next((f for f in frames if f.get("id") == 2), None)
          assert call, "server never answered tools/call (closed pipe or crash)"
          rows = [json.loads(b["text"]) for b in call["result"]["content"]]
          print(f"list_skills returned {len(rows)} skills")
          assert len(rows) >= 30, f"only {len(rows)} skills served"
          assert {r["group"] for r in rows} <= {"setup","python-api","ue4","ue5","ros2","scenario-runner","scenic"}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check npm/bin/carla-agentic-tools.js
      - name: Version must match the Python package
        # npx resolves the PyPI version equal to the npm version, so a mismatch
        # ships a wrapper that installs a different server than it claims.
        run: |
          python - <<'PY'
          import json, re, pathlib, sys
          npm = json.loads(pathlib.Path("npm/package.json").read_text())["version"]
          py = re.search(r'^version = "(.+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          print("npm", npm, "| pyproject", py)
          sys.exit(0 if npm == py else "version mismatch: bump both together")
          PY
      - name: Wrapper errors cleanly with no runner available
        # Its stdout is an MCP stream, so guidance must go to stderr even when
        # nothing can be launched.
        run: |
          set +e
          PATH=/usr/bin:/bin node npm/bin/carla-agentic-tools.js >/tmp/out.txt 2>/tmp/err.txt
          status=$?
          set -e
          echo "exit=$status"; cat /tmp/err.txt
          test "$status" -ne 0                       # must fail, not pretend to serve
          test ! -s /tmp/out.txt                     # stdout is the MCP stream: keep it empty
          grep -q "no Python runner found" /tmp/err.txt
          echo "clean failure OK"
